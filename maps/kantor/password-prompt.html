<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="//play.workadventure.localhost:8880/iframe_api.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
#dialog{background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:20px;color:#fff;width:300px;text-align:center}
h3{margin:0 0 4px;font-size:14px}
p{margin:0 0 12px;font-size:11px;color:#aaa}
input{width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;outline:none;margin-bottom:8px}
input:focus{border-color:#4da6ff}
.buttons{display:flex;gap:8px}
button{flex:1;padding:8px;border:none;border-radius:6px;font:bold 12px sans-serif;cursor:pointer;transition:all 0.15s}
#btn-ok{background:#4da6ff;color:#fff}
#btn-ok:hover{background:#3b95ee}
#btn-cancel{background:rgba(255,255,255,0.15);color:#fff}
#btn-cancel:hover{background:rgba(255,255,255,0.25)}
#error{color:#ff4d4d;font-size:11px;margin-bottom:8px;display:none}
</style></head><body>
<div id="dialog">
  <h3 id="title">🔒 Meeting Room</h3>
  <p id="subtitle">Masukkan password untuk masuk</p>
  <input id="pwd" type="password" placeholder="Password" autofocus>
  <div id="error">Password salah</div>
  <div class="buttons">
    <button id="btn-cancel">Batal</button>
    <button id="btn-ok">Masuk</button>
  </div>
</div>
<script>
const pwd = document.getElementById('pwd');
const error = document.getElementById('error');
let roomName = '';
let correctPassword = '';

window.addEventListener('message', (e) => {
  if (e.data?.type === 'configure') {
    roomName = e.data.room;
    correctPassword = e.data.password;
    document.getElementById('title').textContent = '🔒 ' + e.data.label;
    error.style.display = 'none';
    pwd.value = '';
    pwd.focus();
  }
});

function submit() {
  if (pwd.value === correctPassword) {
    window.parent.postMessage({ type: 'passwordOk', room: roomName }, '*');
  } else {
    error.style.display = 'block';
    pwd.value = '';
    pwd.focus();
  }
}

function cancel() {
  window.parent.postMessage({ type: 'passwordCancel', room: roomName }, '*');
}

document.getElementById('btn-ok').addEventListener('click', submit);
document.getElementById('btn-cancel').addEventListener('click', cancel);
pwd.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submit();
  if (e.key === 'Escape') cancel();
});
</script>
</body></html>
