<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
button{
    width:36px;height:36px;border:none;border-radius:8px;
    background:rgba(0,0,0,0.7);color:#fff;font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background 0.2s;
}
button:hover{background:rgba(0,0,0,0.9)}
button.active{background:rgba(33,150,243,0.85)}
</style></head><body>
<button id="btn" onclick="toggle()" title="Analytics Dashboard">📊</button>
<script>
let on=false;
function toggle(){
    on=!on;
    document.getElementById("btn").className=on?"active":"";
    window.parent.postMessage({type:"toggleAnalytics",visible:on},"*");
}
window.addEventListener("message",e=>{
    if(e.data?.type==="analyticsState"){
        on=e.data.visible;
        document.getElementById("btn").className=on?"active":"";
    }
});
</script>
</body></html>
